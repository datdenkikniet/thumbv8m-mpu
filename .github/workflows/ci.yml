on:
  pull_request:
  push:
    branches: [main]

name: thumbv8m-mpu CI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: cargo test --tests --target host-tuple --no-default-features
      - name: Run tests with 16 regions
        run: TEST_REGION_COUNT=16 cargo test --tests --target host-tuple --no-default-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add default build target
        run: rustup target add thumbv8m.main-none-eabihf
      - name: Build basic example
        run: cargo build --release --example basic --target thumbv8m.main-none-eabihf
      - name: Build library without defmt
        run: cargo build --release --lib --target thumbv8m.main-none-eabihf --no-default-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add default build target
        run: rustup target add thumbv8m.main-none-eabihf
      - name: Run clippy
        run: cargo clippy -- -Dwarnings
      - name: Run clippy without defmt
        run: cargo clippy --no-default-features -- -Dwarnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt -- --check
